name: Create keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYS_PASSWORD: ${{ secrets.KEYS_PASSWORD }}
        run: |
          if [ -f haditak.jks ]; then
            echo "haditak.jks already exists. Refusing to overwrite it."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore haditak.jks -storetype PKCS12 \
            -alias haditak -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYS_PASSWORD" -keypass "$KEYS_PASSWORD" \
            -dname "CN=HadiTak, C=IR"

      - name: Save keystore in this private repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add haditak.jks
          git commit -m "Add keystore"
          git push
